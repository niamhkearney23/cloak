<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloak Drafting</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath fill=%22%231f4e79%22 d=%22M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Z%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm0 2.2 6 2.25V11c0 3.9-2.5 7.6-6 8.9-3.5-1.3-6-5-6-8.9V6.45l6-2.25Z"/></svg>
      <span>Cloak Drafting</span>
    </div>
    <div id="mode" class="mode" hidden></div>
    <div class="topbar-actions">
      <button type="button" class="ghost" id="btn-export">Save matter file</button>
      <label class="ghost button">Open matter file<input type="file" id="btn-import" accept="application/json" hidden></label>
      <button type="button" class="ghost danger" id="btn-clear">Clear everything</button>
    </div>
  </header>

  <div class="layout">
    <nav class="steps" id="steps" aria-label="Steps"></nav>
    <main id="main" tabindex="-1"></main>
  </div>

  <script src="cloak.js"></script>
  <script src="app.js"></script>
</body>
</html>
