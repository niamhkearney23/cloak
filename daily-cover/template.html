<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Instrument Serif";
        src: url("fonts/InstrumentSerif-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("fonts/InstrumentSerif-400-italic.woff2") format("woff2");
        font-weight: 400;
        font-style: italic;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-400.woff2") format("woff2");
        font-weight: 400 500;
        font-style: normal;
      }
      :root {
        --cream: #f4f2ec;
        --ink: #1c1c1c;
        --muted: #6b6b66;
        --navy: #2b4a8c;
        --rule: rgba(28, 28, 28, 0.22);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--cream);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--cream);
        color: var(--ink);
        font-family: "Instrument Serif", Georgia, serif;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      /* Safe band: everything sits between TOP and BOTTOM, which keeps it inside the
         profile-grid crop (3:4 for 9:16 covers) and clear of the Reels interface. */
      .wordmark {
        position: absolute;
        top: {{TOP}}px;
        left: 80px;
        font-size: 30px;
      }
      .series {
        position: absolute;
        top: {{TOP}}px;
        right: 80px;
        font-family: "Inter", sans-serif;
        font-size: 22px;
        letter-spacing: 0.02em;
        color: var(--muted);
        line-height: 41px;
      }
      .handle,
      .issue {
        position: absolute;
        bottom: {{BOTTOM}}px;
        font-family: "Inter", sans-serif;
        font-size: 22px;
        letter-spacing: 0.02em;
        color: var(--muted);
      }
      .handle {
        right: 80px;
      }
      .issue {
        left: 80px;
      }
      .inner {
        position: absolute;
        left: 80px;
        right: 80px;
        top: {{TOP}}px;
        bottom: {{BOTTOM}}px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .date {
        display: flex;
        align-items: baseline;
        gap: 22px;
        padding-bottom: 26px;
        border-bottom: 1px solid var(--rule);
        margin-bottom: 56px;
      }
      .date .day {
        font-size: 150px;
        line-height: 0.8;
        color: var(--navy);
      }
      .date .rest {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .date .month {
        font-size: 46px;
        line-height: 1;
      }
      .date .weekday {
        font-family: "Inter", sans-serif;
        font-size: 22px;
        letter-spacing: 0.02em;
        color: var(--muted);
      }
      .hl {
        font-size: {{HL_SIZE}}px;
        line-height: 1.05;
        letter-spacing: -0.01em;
        max-width: 920px;
      }
      .hl .line {
        display: block;
        text-wrap: balance; /* even line lengths, no one-word orphans */
      }
      .ul {
        position: relative;
        display: inline;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 20' preserveAspectRatio='none'><path d='M4 12 C 90 6, 200 16, 396 9' fill='none' stroke='%232b4a8c' stroke-width='9' stroke-linecap='round'/></svg>");
        background-repeat: no-repeat;
        background-position: 0 100%;
        background-size: 100% 0.2em;
        padding-bottom: 0.12em;
        -webkit-box-decoration-break: clone;
        box-decoration-break: clone;
      }
      .case {
        margin-top: 64px;
        padding-top: 26px;
        border-top: 1px solid var(--rule);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .case .court {
        font-family: "Inter", sans-serif;
        font-size: 22px;
        letter-spacing: 0.02em;
        color: var(--navy);
      }
      .case .name {
        font-size: 36px;
        line-height: 1.15;
        font-style: italic;
        text-wrap: balance;
      }
      .case .cite {
        font-family: "Inter", sans-serif;
        font-size: 22px;
        letter-spacing: 0.02em;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cover" data-start="0" data-duration="1" data-width="{{W}}" data-height="{{H}}">
      <div id="page" class="clip" data-start="0" data-duration="1" data-track-index="1">
        <div class="wordmark">Lawgistics.</div>
        <div class="series">Daily Court Update</div>
        <div class="inner">
          <div class="date">
            <span class="day">{{DAY}}</span>
            <span class="rest"><span class="month">{{MONTH_YEAR}}</span><span class="weekday">{{WEEKDAY}}</span></span>
          </div>
          <div class="hl">{{HEADLINE_HTML}}</div>
          <div class="case">
            <span class="court">{{COURT}}</span>
            <span class="name">{{CASE}}</span>
            <span class="cite">{{CITATION}}</span>
          </div>
        </div>
        <div class="issue">{{ISSUE}}</div>
        <div class="handle">lawgistics.my</div>
      </div>
    </div>
    <script>
      window.__timelines["cover"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
