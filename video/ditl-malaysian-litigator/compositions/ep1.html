          function chars(el) {
            const text = el.textContent; el.textContent = "";

          }
          // waterfall-entry: binary reveal + whip from below, overlapping by a frame or two
          function waterfall(spans, t0, dur, y, overlapFrames) {
            let t = t0;
            spans.forEach((s) => { tl.set(s, { opacity: 1, y: y }, t); tl.to(s, { y: 0, duration: dur, ease: "power4.out" }, t); t += dur - overlapFrames * F; });
            return t;
          }

            const ts = q("#" + p + "-ts"); if (ts) waterfall(chars(ts), t0, 0.16, 90, 2);

            const hl = q("#" + p + "-hl"); if (hl) waterfall(words(hl), t0 + 0.22, 0.15, 60, 1);

          }
          // vertical push (editorial page turn): outgoing and incoming move at the same T
          function push(prev, next, T) {
            tl.to(prev, { yPercent: -100, duration: 0.45, ease: "power3.in" }, T);
            tl.set(next, { opacity: 1 }, T);
            tl.fromTo(next, { yPercent: 100 }, { yPercent: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, T);
            tl.set(prev, { opacity: 0 }, T + 0.45);
          }

          // ambient layer: ghost word drifts, foot rule breathes (finite repeats under a finite root duration)
          tl.fromTo("#ep1-ghost", { x: 40 }, { x: -40, duration: 12.22, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
