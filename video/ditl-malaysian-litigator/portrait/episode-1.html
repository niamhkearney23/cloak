<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Episod 1 — Pagi (portrait)</title>
    <script src="../vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #f4f1ea; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f4f1ea; font-family: Inter, -apple-system, "Segoe UI", sans-serif; }
      @font-face { font-family: "Lora"; font-style: normal; font-weight: 400; src: url("../vendor/fonts/lora-400.woff2") format("woff2"); }
      @font-face { font-family: "Lora"; font-style: italic; font-weight: 400; src: url("../vendor/fonts/lora-400-italic.woff2") format("woff2"); }
      @font-face { font-family: "Lora"; font-style: normal; font-weight: 600; src: url("../vendor/fonts/lora-600.woff2") format("woff2"); }
      @font-face { font-family: "Lora"; font-style: normal; font-weight: 700; src: url("../vendor/fonts/lora-700.woff2") format("woff2"); }
      @font-face { font-family: "Lora"; font-style: italic; font-weight: 600; src: url("../vendor/fonts/lora-600-italic.woff2") format("woff2"); }
      /* Episode slots stretch to fill the root; the root timeline pushes them like pages. */
      [data-composition-id="solo-ep1-portrait"] > div[data-composition-src] { position: absolute; inset: 0; will-change: transform; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="solo-ep1-portrait" data-start="0" data-width="1080" data-height="1920" data-duration="24.45">
      <div
        id="el-ep1"
        data-composition-id="ep1"
        data-composition-src="compositions/portrait/ep1.html"
        data-start="0.00"
        data-duration="24.45"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Sound: music bed, foley, narration. Built by audio/make-audio.py. -->
      <audio id="solo-ep1-portrait-bed" src="assets/bed.mp3" data-start="0" data-duration="24.45" data-media-start="5.00" data-track-index="10" data-volume="1" data-fade-out="1.2"></audio>
      <audio id="solo-ep1-portrait-sfx" src="assets/sfx-full.mp3" data-start="0" data-duration="24.45" data-media-start="5.00" data-track-index="11" data-volume="0.9"></audio>
      <audio id="solo-ep1-portrait-vo" src="assets/vo-full.mp3" data-start="0" data-duration="24.45" data-media-start="5.00" data-track-index="12" data-volume="1"></audio>
    </div>
    <script>
      // Thin orchestrator: scene animation lives in the sub-compositions. The root
      // timeline only owns the vertical push between consecutive episodes.
      const tl = gsap.timeline({ paused: true });
      window.__timelines["solo-ep1-portrait"] = tl;
    </script>
  </body>
</html>
