<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Instrument Serif";
        src: url("fonts/InstrumentSerif-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("fonts/InstrumentSerif-400-italic.woff2") format("woff2");
        font-weight: 400;
        font-style: italic;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-400.woff2") format("woff2");
        font-weight: 400 500;
        font-style: normal;
      }
      :root {
        --cream: #f4f2ec;
        --ink: #1c1c1c;
        --muted: #6b6b66;
        --navy: #2b4a8c;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--cream);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--cream);
        color: var(--ink);
        font-family: "Instrument Serif", Georgia, serif;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      /* The grid shows this cover cropped to 3:4 (y 240–1680) and, in some places, 1:1 (y 420–1500).
         Wordmark and handle sit inside the 3:4 band; headline and photo inside the square. */
      .wordmark {
        position: absolute;
        top: 320px;
        left: 80px;
        font-size: 30px;
        letter-spacing: 0.01em;
      }
      .handle {
        position: absolute;
        bottom: 300px;
        right: 80px;
        font-family: "Inter", sans-serif;
        font-size: 22px;
        letter-spacing: 0.02em;
        color: var(--muted);
      }
      .issue {
        position: absolute;
        bottom: 300px;
        left: 80px;
        font-family: "Inter", sans-serif;
        font-size: 22px;
        letter-spacing: 0.02em;
        color: var(--muted);
      }
      .inner {
        position: absolute;
        inset: 0;
        padding: 430px 80px 430px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .hl {
        font-size: 104px;
        line-height: 1.04;
        letter-spacing: -0.01em;
        max-width: 920px;
      }
      .hl .line {
        display: block;
      }
      .hl i {
        font-style: italic;
      }
      /* loose hand-drawn underline under the key phrase */
      .ul {
        position: relative;
        display: inline-block;
      }
      .ul svg {
        position: absolute;
        left: -0.02em;
        right: -0.02em;
        bottom: -0.16em;
        width: 104%;
        height: 0.22em;
        overflow: visible;
      }
      .ul svg path {
        fill: none;
        stroke: var(--navy);
        stroke-width: 9;
        stroke-linecap: round;
      }
      .photo {
        margin-top: 64px;
        width: 920px;
        height: 500px;
        overflow: hidden;
        border: 1px solid rgba(28, 28, 28, 0.35);
        background: #e3e0d8;
      }
      .photo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.06);
      }
      .sub {
        margin-top: 28px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        max-width: 920px;
        font-size: 30px;
        color: var(--muted);
      }
      .sub .val {
        color: var(--navy);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cover" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <div id="page" class="clip" data-start="0" data-duration="1" data-track-index="1">
        <div class="wordmark">Lawgistics.</div>
        <div class="inner">
          <div class="hl">
            <span class="line">A road. 58 years.</span>
            <span class="line">
              <span class="ul">No paperwork.
                <svg viewBox="0 0 400 20" preserveAspectRatio="none" aria-hidden="true">
                  <path d="M4 12 C 90 6, 200 16, 396 9" />
                </svg>
              </span>
            </span>
          </div>
          <div class="photo"><img src="assets/duke-highway.jpg" alt="" /></div>
          <div class="sub">
            <span>Registered title upheld, High Court</span>
            <span class="val">RM4.8m damages</span>
          </div>
        </div>
        <div class="issue">High Court Update · 02</div>
        <div class="handle">lawgistics.my</div>
      </div>
    </div>
    <script>
      // A still: nothing moves, but the runtime still expects one registered timeline.
      window.__timelines["cover"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
