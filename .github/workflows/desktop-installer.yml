# Builds the Cloak desktop installers (Windows .exe, Mac .dmg).
# Run it by hand from the Actions tab, or push a tag like desktop-v0.1.0.
# The installers appear under "Artifacts" on the run's page.
name: Desktop installer

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: local/package-lock.json
      - run: npm ci
      # The same tests as on the development machine, on this system.
      - run: npm test
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: cloak-installer-${{ matrix.os }}
          path: |
            local/dist/*.exe
            local/dist/*.dmg
          if-no-files-found: error
