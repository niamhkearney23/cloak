# Builds the Cloak desktop installers (Windows .exe, Mac .dmg).
# Runs when the desktop code changes. It can also be run by hand from the
# Actions tab, or by pushing a tag like desktop-v0.1.0.
# The installers appear under "Artifacts" on the run's page.
name: Desktop installer

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
    branches: ['claude/nice-volta-pqdwc3']
    paths: ['local/**', 'public/cloak.js', '.github/workflows/desktop-installer.yml']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: local/package-lock.json
      - run: npm ci
      # The same tests as on the development machine, on this system.
      - name: Tests
        shell: bash
        run: |
          npm test > test.log 2>&1 || { echo "FAILED TESTS:"; grep -A40 '^not ok' test.log | grep -vE 'duration_ms|^\s+type:|^\s+---|^\s+\.\.\.' | head -150; tail -12 test.log; exit 1; }
          tail -12 test.log
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: cloak-installer-${{ matrix.os }}
          path: |
            local/dist/*.exe
            local/dist/*.dmg
          if-no-files-found: error
