<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=600, height=400" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 600px;
        height: 400px;
        overflow: hidden;
        background: transparent;
      }
      #card-root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      }
      .label {
        color: #333333;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .number {
        font-size: 128px;
        font-weight: 700;
        color: #1F2937;
        line-height: 1;
        min-width: 200px;
        text-align: center;
      }
      .pill {
        background: #10B981;
        color: white;
        padding: 12px 28px;
        border-radius: 24px;
        font-size: 16px;
        font-weight: 600;
        white-space: nowrap;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="card-root" data-composition-id="card" data-width="600" data-height="400" data-start="0" data-duration="6">
      <div class="label clip" data-start="0" data-duration="6">MY FIRST RENDER</div>
      <div id="counter" class="number clip" data-start="0" data-duration="6">0</div>
      <div id="pill" class="pill clip" data-start="0" data-duration="6">Made with Claude Code</div>
    </div>
    <script src="../node_modules/gsap/dist/gsap.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["card"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
