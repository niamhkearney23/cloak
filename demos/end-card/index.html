<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>End card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Young+Serif&display=swap">
  <style>
    /* The closing frame of the advert (28 to 35 seconds). Designed at 1600x900
       and scaled to fit any window, so what you see is what gets recorded. */
    :root { --paper: #f3ede3; --ink: #2b2521; --muted: #6e645a; --rust: #a8502c; --line: #d8ccba; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; }
    body { display: grid; place-items: center; font-family: "Karla", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .22;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.17 0 0 0 0 0.14 0 0 0 0 0.12 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
    .card { width: 1600px; height: 900px; flex: none; position: relative; transform-origin: center; }
    .shots { position: absolute; left: 0; right: 0; top: 70px; height: 330px; }
    .shots img { position: absolute; top: 0; width: 470px; border: 10px solid #fff; border-radius: 4px; box-shadow: 0 1px 2px rgba(43,37,33,.15), 0 22px 40px -22px rgba(43,37,33,.55); opacity: 0; animation: rise .8s cubic-bezier(.2,.9,.3,1) forwards; }
    .shots .s1 { left: 170px; --r: -5deg; top: 30px; animation-delay: .1s; }
    .shots .s2 { left: 565px; --r: 1.5deg; top: 0; z-index: 2; animation-delay: .3s; }
    .shots .s3 { left: 960px; --r: 5deg; top: 34px; animation-delay: .5s; }
    @keyframes rise { from { opacity: 0; transform: translateY(40px) rotate(var(--r)); } to { opacity: 1; transform: translateY(0) rotate(var(--r)); } }
    h1 { position: absolute; left: 0; right: 0; top: 470px; margin: 0; text-align: center; font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: 96px; letter-spacing: -.015em; opacity: 0; animation: fade .9s ease-out 1.1s forwards; }
    .who { position: absolute; left: 0; right: 0; top: 650px; display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0; animation: fade .9s ease-out 2.1s forwards; }
    .name { font-size: 40px; font-weight: 700; }
    .link { display: flex; align-items: center; gap: 12px; font-size: 28px; color: var(--muted); }
    .link b { color: var(--rust); font-weight: 700; }
    .rule { width: 60px; height: 3px; background: var(--rust); margin-bottom: 8px; }
    @keyframes fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="card" id="card">
    <!-- Stills written by record.mjs. Missing ones are simply left out. -->
    <div class="shots">
      <img class="s1" src="../recordings/1-legal-dashboard.png" alt="" onerror="this.remove()">
      <img class="s2" src="../recordings/3-booking-site.png" alt="" onerror="this.remove()">
      <img class="s3" src="../recordings/2-marketing-automation.png" alt="" onerror="this.remove()">
    </div>
    <h1>What do you want to build?</h1>
    <div class="who">
      <span class="rule"></span>
      <span class="name" id="name"></span>
      <span class="link" id="link" hidden>Find me on Fiverr <b id="fiverr"></b></span>
    </div>
  </div>
  <script src="../profile.js"></script>
  <script>
    const P = window.PROFILE || {};
    document.getElementById('name').textContent = P.name || '';
    if (P.fiverr) { document.getElementById('fiverr').textContent = P.fiverrLabel(); document.getElementById('link').hidden = false; }
    const fit = () => { const s = Math.min(innerWidth / 1600, innerHeight / 900); document.getElementById('card').style.transform = `scale(${s})`; };
    addEventListener('resize', fit); fit();
  </script>
</body>
</html>
